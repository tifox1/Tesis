{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:70px auto">
  <h1>Iniciar sesión</h1>
  <p class="muted">Acceso exclusivo para usuarios internos autorizados.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="field"><label for="id_username">Usuario</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">Contraseña</label>{{ form.password }}</div>
    <button type="submit">Ingresar</button>
  </form>
</div>
{% endblock %}
